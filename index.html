<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Tools · 4 in 1 Pro</title>
  <link rel="icon" type="image/x-icon" href="clock.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background: radial-gradient(circle at 20% 30%, #141e33, #0a0f1a);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .dashboard {
      max-width: 1100px;
      width: 100%;
      height: 100%;
      max-height: 700px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(2px);
      padding: 1.8rem;
      border-radius: 3.5rem;
      box-shadow: 0 30px 60px -10px rgba(0,0,0,0.9), inset 0 1px 1px rgba(255,255,255,0.04);
      border: 1px solid rgba(255, 255, 255, 0.02);
    }
    .card {
      background: rgba(14, 22, 40, 0.65);
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 1.4rem 1.2rem 1.6rem;
      box-shadow: 0 20px 40px -12px #000000aa, inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.02);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      height: 100%;
      position: relative;
    }
    .card:hover {
      border-color: rgba(120, 180, 255, 0.12);
      transform: translateY(-4px);
      box-shadow: 0 30px 50px -14px #000000cc;
    }
    .card h3 {
      color: #b8cef0;
      font-weight: 500;
      letter-spacing: 2px;
      font-size: 0.75rem;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      opacity: 0.7;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      padding-bottom: 0.5rem;
      width: 100%;
      text-align: center;
      flex-shrink: 0;
    }
    .time-display {
      font-size: 2.6rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: #f0f7ff;
      text-shadow: 0 0 20px rgba(70, 140, 255, 0.2);
      background: rgba(0, 0, 0, 0.35);
      padding: 0.2rem 0.8rem;
      border-radius: 2.5rem;
      width: 100%;
      text-align: center;
      font-variant-numeric: tabular-nums;
      box-shadow: inset 0 6px 12px rgba(0,0,0,0.6);
      margin-bottom: 0.6rem;
      border: 1px solid rgba(255, 255, 255, 0.02);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }
    /* timer ring wrapper */
    .timer-ring-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .timer-ring-container {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0.2rem auto;
    }
    .timer-ring-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      background: transparent;
      box-shadow: none;
      border: none;
    }
    #timerRingCanvas {
      z-index: 1;
    }
    #timerDisplay {
      position: relative;
      z-index: 3;
      background: transparent;
      box-shadow: none;
      border: none;
      font-size: 2.2rem;
      padding: 0;
      margin: 0;
      width: auto;
      display: inline-block;
      backdrop-filter: none;
      background: transparent;
      text-shadow: 0 0 20px rgba(70, 140, 255, 0.4);
      line-height: 1.2;
    }
    .timer-ring-container .time-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: transparent;
      box-shadow: none;
      border: none;
      font-size: 2rem;
      padding: 0;
      margin: 0;
      width: auto;
      backdrop-filter: none;
      text-shadow: 0 0 20px rgba(70, 140, 255, 0.5);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      margin: 0.3rem 0 0.2rem;
      width: 100%;
      flex-shrink: 0;
      position: relative;
      z-index: 5;
    }
    .controls button {
      background: rgba(50, 80, 140, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: #d6e6ff;
      padding: 0.35rem 0.9rem;
      border-radius: 2.5rem;
      font-weight: 500;
      font-size: 0.7rem;
      letter-spacing: 0.4px;
      backdrop-filter: blur(4px);
      cursor: pointer;
      transition: 0.15s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      flex: 1 0 auto;
      min-width: 50px;
    }
    .controls button:hover {
      background: rgba(70, 130, 230, 0.3);
      border-color: rgba(160, 200, 255, 0.25);
      color: #ffffff;
      transform: scale(0.97);
    }
    .controls button:active { transform: scale(0.92); }
    .controls .reset-btn {
      background: rgba(200, 70, 70, 0.12);
      border-color: rgba(255, 100, 100, 0.08);
    }
    .controls .reset-btn:hover {
      background: rgba(200, 70, 70, 0.25);
      border-color: rgba(255, 130, 130, 0.2);
    }
    .sub-label {
      font-size: 0.6rem;
      color: #6d89b8;
      letter-spacing: 1px;
      margin-top: 0.2rem;
      opacity: 0.6;
      flex-shrink: 0;
    }
    .clock-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      margin: 0.1rem 0;
    }
    canvas {
      background: radial-gradient(circle at 30% 25%, #1f2d4a, #0a1120);
      border-radius: 50%;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      display: block;
      width: 150px;
      height: 150px;
      max-width: 100%;
      aspect-ratio: 1/1;
      border: 2px solid rgba(255, 255, 255, 0.02);
    }
    .custom-timer-row {
      display: flex;
      gap: 0.4rem;
      margin: 0.3rem 0 0.1rem;
      width: 100%;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      z-index: 5;
    }
    .custom-timer-row input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e0edff;
      padding: 0.3rem 0.6rem;
      border-radius: 2rem;
      width: 70px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 400;
      outline: none;
      transition: 0.15s;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
    }
    .custom-timer-row input:focus {
      border-color: rgba(100, 170, 255, 0.4);
      background: rgba(10, 20, 40, 0.6);
    }
    .custom-timer-row button {
      background: rgba(50, 130, 220, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: #c8ddff;
      padding: 0.3rem 1rem;
      border-radius: 2.5rem;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .custom-timer-row button:hover {
      background: rgba(70, 150, 255, 0.25);
      border-color: rgba(160, 200, 255, 0.2);
      color: white;
    }
    #analogLabel { font-size: 0.6rem; color: #7b98cc; margin-top: 0.1rem; flex-shrink: 0; }
    .preset-click {
      cursor: pointer;
      color: #9bb9f0;
      margin: 0 3px;
      font-weight: 500;
      transition: 0.1s;
    }
    .preset-click:hover { color: #c8ddff; text-shadow: 0 0 8px rgba(100,180,255,0.3); }

    /* digital clock with AM/PM */
    #digitalDisplay {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      flex-wrap: wrap;
    }
    .ampm-badge {
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: 1px;
      background: rgba(255,255,255,0.03);
      padding: 0.1rem 0.7rem;
      border-radius: 3rem;
      border: 1px solid rgba(255,255,255,0.04);
      color: #9bb7e6;
      text-shadow: 0 0 10px rgba(70,140,255,0.15);
      margin-left: 0.2rem;
      opacity: 0.8;
    }

    @media (max-width: 750px) {
      .dashboard {
        grid-template-columns: 1fr;
        max-height: 100vh;
        gap: 1rem;
        padding: 1rem;
        border-radius: 2.5rem;
      }
      body { padding: 0.8rem; }
      .time-display { font-size: 2.4rem; }
      canvas { width: 130px; height: 130px; }
      .card { padding: 1rem 0.8rem 1.2rem; }
      .timer-ring-container { width: 110px; height: 110px; }
      .ampm-badge { font-size: 1rem; padding: 0.1rem 0.5rem; }
    }
    @media (min-width: 1200px) {
      .dashboard { max-width: 1150px; max-height: 750px; }
      .time-display { font-size: 3rem; }
      canvas { width: 180px; height: 180px; }
      .timer-ring-container { width: 160px; height: 160px; }
      .ampm-badge { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
<div class="dashboard">
  <!-- TIMER with progress ring -->
  <div class="card">
    <h3>⏳ Timer</h3>
    <div class="timer-ring-wrapper">
      <div class="timer-ring-container">
        <canvas id="timerRingCanvas" width="300" height="300"></canvas>
        <div class="time-display" id="timerDisplay">00:00</div>
      </div>
    </div>
    <div class="controls">
      <button id="timerStartBtn">▶ Start</button>
      <button id="timerPauseBtn">⏸ Pause</button>
      <button id="timerResetBtn" class="reset-btn">⟳ Reset</button>
    </div>
    <div class="custom-timer-row">
      <input type="number" id="customTimerInput" value="10" min="1" max="3600" step="1">
      <button id="setCustomTimerBtn">Set</button>
    </div>
    <div class="sub-label">
      <span class="preset-click" id="preset5">5s</span> · 
      <span class="preset-click" id="preset30">30s</span> · 
      <span class="preset-click" id="preset60">60s</span>
    </div>
  </div>

  <!-- STOPWATCH -->
  <div class="card">
    <h3>⏱️ Stopwatch</h3>
    <div class="time-display" id="stopwatchDisplay">00:00.0</div>
    <div class="controls">
      <button id="stopwatchStartBtn">▶ Start</button>
      <button id="stopwatchPauseBtn">⏸ Pause</button>
      <button id="stopwatchResetBtn" class="reset-btn">⟳ Reset</button>
    </div>
    <div class="sub-label">precision 0.1s · lap</div>
  </div>

  <!-- DIGITAL CLOCK with AM/PM -->
  <div class="card">
    <h3>🕒 Digital</h3>
    <div class="time-display" id="digitalDisplay">
      <span id="digitalTime">--:--:--</span>
      <span class="ampm-badge" id="ampmBadge">--</span>
    </div>
    <div class="sub-label" id="dateDisplay" style="margin-top:0.2rem;">📅 loading...</div>
  </div>

  <!-- ANALOG CLOCK -->
  <div class="card">
    <h3>🕰️ Analog</h3>
    <div class="clock-container">
      <canvas id="analogCanvas" width="300" height="300"></canvas>
    </div>
    <div id="analogLabel" style="font-size:0.7rem; color:#9bb7e6; letter-spacing:1px; margin-top:0.1rem;">● live</div>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ---------- TIMER WITH PROGRESS RING ----------
    let timerSeconds = 0;
    let timerMaxSeconds = 10;
    let timerInterval = null;
    let timerRunning = false;
    const timerDisplay = document.getElementById('timerDisplay');
    const customInput = document.getElementById('customTimerInput');
    const ringCanvas = document.getElementById('timerRingCanvas');
    const ringCtx = ringCanvas.getContext('2d');

    function drawTimerRing(seconds, maxSeconds) {
      const w = ringCanvas.width, h = ringCanvas.height;
      const centerX = w/2, centerY = h/2;
      const radius = Math.min(w, h) * 0.42;
      const lineWidth = 12;

      ringCtx.clearRect(0, 0, w, h);

      ringCtx.beginPath();
      ringCtx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ringCtx.strokeStyle = 'rgba(255,255,255,0.04)';
      ringCtx.lineWidth = lineWidth;
      ringCtx.stroke();

      const progress = maxSeconds > 0 ? Math.min(1, seconds / maxSeconds) : 0;
      const startAngle = -Math.PI / 2;
      const endAngle = startAngle + (progress * 2 * Math.PI);

      const grad = ringCtx.createConicGradient(startAngle, centerX, centerY);
      grad.addColorStop(0, '#4a8eff');
      grad.addColorStop(0.5, '#9f7aff');
      grad.addColorStop(1, '#ff7a9e');

      ringCtx.beginPath();
      ringCtx.arc(centerX, centerY, radius, startAngle, endAngle);
      ringCtx.strokeStyle = grad;
      ringCtx.lineWidth = lineWidth;
      ringCtx.lineCap = 'round';
      ringCtx.shadowColor = 'rgba(100,160,255,0.25)';
      ringCtx.shadowBlur = 20;
      ringCtx.stroke();
      ringCtx.shadowBlur = 0;

      ringCtx.beginPath();
      ringCtx.arc(centerX, centerY, 4, 0, 2 * Math.PI);
      ringCtx.fillStyle = '#b0ceff';
      ringCtx.shadowBlur = 15;
      ringCtx.shadowColor = '#3a7bd5';
      ringCtx.fill();
      ringCtx.shadowBlur = 0;
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      timerDisplay.textContent = `${m}:${s}`;
      drawTimerRing(timerSeconds, timerMaxSeconds);
    }

    function timerTick() {
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerRunning = false;
        timerSeconds = 0;
        updateTimerDisplay();
        return;
      }
      timerSeconds--;
      updateTimerDisplay();
      if (timerSeconds === 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerRunning = false;
        drawTimerRing(0, timerMaxSeconds);
      }
    }

    function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } timerRunning = false; }
    function startTimer() {
      if (timerRunning) return;
      if (timerSeconds <= 0) { 
        timerSeconds = Math.max(1, timerMaxSeconds); 
        updateTimerDisplay();
      }
      stopTimer();
      timerInterval = setInterval(timerTick, 1000);
      timerRunning = true;
    }
    function pauseTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } timerRunning = false; }
    function resetTimer() { 
      pauseTimer(); 
      timerSeconds = 0; 
      timerMaxSeconds = 10; 
      customInput.value = 10;
      updateTimerDisplay(); 
    }
    function setTimer(seconds) { 
      pauseTimer(); 
      const val = Math.max(0, seconds);
      timerSeconds = val;
      timerMaxSeconds = val || 1;
      customInput.value = val;
      updateTimerDisplay(); 
    }

    document.getElementById('timerStartBtn').addEventListener('click', startTimer);
    document.getElementById('timerPauseBtn').addEventListener('click', pauseTimer);
    document.getElementById('timerResetBtn').addEventListener('click', resetTimer);
    document.getElementById('setCustomTimerBtn').addEventListener('click', function() {
      let val = parseInt(customInput.value, 10);
      if (isNaN(val) || val < 1) val = 1;
      if (val > 3600) val = 3600;
      customInput.value = val;
      setTimer(val);
    });
    document.getElementById('preset5').addEventListener('click', ()=> { setTimer(5); });
    document.getElementById('preset30').addEventListener('click', ()=> { setTimer(30); });
    document.getElementById('preset60').addEventListener('click', ()=> { setTimer(60); });

    // ---------- STOPWATCH ----------
    let swSeconds = 0;
    let swInterval = null;
    let swRunning = false;
    const swDisplay = document.getElementById('stopwatchDisplay');

    function updateStopwatchDisplay() {
      const totalSec = Math.floor(swSeconds / 10);
      const tenths = swSeconds % 10;
      const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      swDisplay.textContent = `${m}:${s}.${tenths}`;
    }
    function swTick() { swSeconds++; updateStopwatchDisplay(); }
    function stopSw() { if (swInterval) { clearInterval(swInterval); swInterval = null; } swRunning = false; }
    function startSw() { if (swRunning) return; stopSw(); swInterval = setInterval(swTick, 100); swRunning = true; }
    function pauseSw() { if (swInterval) { clearInterval(swInterval); swInterval = null; } swRunning = false; }
    function resetSw() { pauseSw(); swSeconds = 0; updateStopwatchDisplay(); }

    document.getElementById('stopwatchStartBtn').addEventListener('click', startSw);
    document.getElementById('stopwatchPauseBtn').addEventListener('click', pauseSw);
    document.getElementById('stopwatchResetBtn').addEventListener('click', resetSw);

    // ---------- DIGITAL CLOCK with AM/PM ----------
    const digitalTime = document.getElementById('digitalTime');
    const ampmBadge = document.getElementById('ampmBadge');
    const dateDisplay = document.getElementById('dateDisplay');

    function updateDigitalClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      const h12 = hours % 12 || 12;
      const hStr = String(h12).padStart(2, '0');
      digitalTime.textContent = `${hStr}:${minutes}:${seconds}`;
      ampmBadge.textContent = ampm;
      dateDisplay.textContent = now.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
    }
    updateDigitalClock();
    setInterval(updateDigitalClock, 1000);

    // ---------- ANALOG CLOCK ----------
    const canvas = document.getElementById('analogCanvas');
    const ctx = canvas.getContext('2d');
    const analogLabel = document.getElementById('analogLabel');

    function drawAnalogClock() {
      const now = new Date();
      const hours = now.getHours() % 12;
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      const w = canvas.width, h = canvas.height;
      const centerX = w/2, centerY = h/2;
      const radius = Math.min(w, h) * 0.42;

      ctx.clearRect(0, 0, w, h);

      const grad = ctx.createRadialGradient(centerX-12, centerY-12, 10, centerX, centerY, radius*1.2);
      grad.addColorStop(0, '#253453');
      grad.addColorStop(0.9, '#0a1120');
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius*1.05, 0, 2*Math.PI);
      ctx.fillStyle = grad;
      ctx.shadowColor = 'rgba(0,0,0,0.7)';
      ctx.shadowBlur = 25;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2*Math.PI);
      ctx.strokeStyle = '#9bb7e6';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#dbeafe';
      ctx.font = `bold ${radius * 0.16}px 'Inter', 'Segoe UI', system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 1; i <= 12; i++) {
        const angle = (i / 12) * 2 * Math.PI - Math.PI/2;
        const numRadius = radius * 0.78;
        const x = centerX + Math.cos(angle) * numRadius;
        const y = centerY + Math.sin(angle) * numRadius;
        ctx.shadowColor = 'rgba(0,20,40,0.6)';
        ctx.shadowBlur = 10;
        ctx.fillStyle = (i % 3 === 0) ? '#ffffff' : '#b8cef0';
        ctx.fillText(String(i), x, y);
      }
      ctx.shadowBlur = 0;

      for (let i = 0; i < 60; i++) {
        if (i % 5 === 0) continue;
        const angle = (i / 60) * 2 * Math.PI - Math.PI/2;
        const inner = radius * 0.88;
        const outer = radius * 0.94;
        ctx.beginPath();
        ctx.moveTo(centerX + Math.cos(angle)*inner, centerY + Math.sin(angle)*inner);
        ctx.lineTo(centerX + Math.cos(angle)*outer, centerY + Math.sin(angle)*outer);
        ctx.strokeStyle = '#4a6188';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * 2 * Math.PI - Math.PI/2;
        const inner = radius * 0.85;
        const outer = radius * 0.93;
        ctx.beginPath();
        ctx.moveTo(centerX + Math.cos(angle)*inner, centerY + Math.sin(angle)*inner);
        ctx.lineTo(centerX + Math.cos(angle)*outer, centerY + Math.sin(angle)*outer);
        ctx.strokeStyle = '#d0e2ff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      const hourAngle = (hours + minutes/60) * (Math.PI/6) - Math.PI/2;
      const minAngle = (minutes + seconds/60) * (Math.PI/30) - Math.PI/2;
      const secAngle = seconds * (Math.PI/30) - Math.PI/2;

      ctx.shadowColor = 'rgba(60,120,220,0.3)';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(centerX + Math.cos(hourAngle)*radius*0.5, centerY + Math.sin(hourAngle)*radius*0.5);
      ctx.strokeStyle = '#eaf2ff';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(centerX + Math.cos(minAngle)*radius*0.7, centerY + Math.sin(minAngle)*radius*0.7);
      ctx.strokeStyle = '#c2d9ff';
      ctx.lineWidth = 3.2;
      ctx.stroke();
      ctx.shadowColor = '#ff8855';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(centerX + Math.cos(secAngle)*radius*0.82, centerY + Math.sin(secAngle)*radius*0.82);
      ctx.strokeStyle = '#ff9966';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.arc(centerX, centerY, 7, 0, 2*Math.PI);
      ctx.fillStyle = '#dbeafe';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#5599ff';
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 3, 0, 2*Math.PI);
      ctx.fillStyle = '#0b1120';
      ctx.fill();

      const hh = String(now.getHours()).padStart(2,'0');
      const mm = String(now.getMinutes()).padStart(2,'0');
      analogLabel.textContent = `🕐 ${hh}:${mm}`;
    }

    drawAnalogClock();
    setInterval(drawAnalogClock, 1000);

    // init timer
    timerMaxSeconds = 10;
    timerSeconds = 0;
    updateTimerDisplay();
    updateStopwatchDisplay();
    customInput.value = 10;
    drawTimerRing(0, 10);
  })();
</script>
